#:schema https://secretspec.dev/schema/secretspec.schema.json

[project]
name = "nixos-config"
revision = "1.0"

# Backed by `pass` (the unix password manager), keyed as
# syncthing/keys/<host>. Populate with e.g.:
#   pass insert syncthing/keys/Index
#   pass insert syncthing/keys/Apthos
[providers]
local = "pass://syncthing/keys/{key}"

[profiles.default]
Index = { description = "Syncthing REST API key for Index (configDir/config.xml), for querying its REST API remotely", providers = [
  "local",
] }
Apthos = { description = "Syncthing REST API key for Apthos (configDir/config.xml), for querying its REST API remotely", providers = [
  "local",
] }
