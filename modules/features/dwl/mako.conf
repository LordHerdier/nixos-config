font=monospace 12
background-color=@surface@
text-color=@fg@
border-color=@border@
border-size=1
default-timeout=5000
# What dwl-notifications lists; mako's default keeps only 5.
max-history=50

[urgency=high]
border-color=@error@
default-timeout=0

# Toggled by dwl-dnd. Last, so it wins over the sections above.
[mode=do-not-disturb]
invisible=1
